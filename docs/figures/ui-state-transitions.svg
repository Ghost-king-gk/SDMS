<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<title>界面状态转换图</title>
<desc>空闲、已选中、编辑中、确认删除四个主状态与错误提示之间的转换关系。</desc>
<rect x="0" y="0" width="900" height="400" fill="#FFFFFF"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="60" y="70" width="200" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="160.0" y="93.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">空闲</text>
<text x="160.0" y="112.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">无选中，列表可浏览</text>
<rect x="350" y="70" width="200" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="450.0" y="93.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">已选中</text>
<text x="450.0" y="112.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">单行高亮，selected = id</text>
<rect x="640" y="70" width="200" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="740.0" y="93.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">编辑中</text>
<text x="740.0" y="112.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">表单打开，新增或修改</text>
<rect x="350" y="270" width="200" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="450.0" y="293.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">确认删除</text>
<text x="450.0" y="312.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">模态对话框等待选择</text>
<rect x="640" y="270" width="200" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="740.0" y="293.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">错误提示</text>
<text x="740.0" y="312.0" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">解析或写入失败</text>
<path d="M260 102 L342 102" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="305" y="92" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">选中一行</text>
<path d="M350 86 C 320 48, 290 48, 260 86" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="305" y="44" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">切换日期 / 清空选择</text>
<path d="M160 134 L160 192 L740 192 L740 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="300" y="182" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">点击「新增」</text>
<path d="M550 102 L632 102" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="595" y="90" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">点击「修改」</text>
<path d="M740 70 C 740 28, 160 28, 160 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="450" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">保存成功 / 取消关闭</text>
<path d="M470 134 L470 262" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="478" y="205" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">点击删除</text>
<path d="M410 262 L410 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="400" y="205" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">取消</text>
<path d="M350 302 L200 302 L200 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="285" y="316" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">确定 → 删除成功后刷新</text>
<path d="M700 134 L700 262" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="710" y="205" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">解析 / 保存失败</text>
<path d="M680 262 L680 142" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="670" y="205" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">关闭，保留已填内容</text>
<path d="M550 302 L632 302" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="591" y="290" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">删除失败</text>
<text x="450" y="378" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">实线为正常路径，虚线为失败与取消路径；任何状态下写入失败都不得假装成功</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<title>新增与修改共用表单线框图</title>
<desc>标题、日期、时间、备注四个字段，字段级错误提示，底部取消与保存。</desc>
<rect x="0" y="0" width="900" height="440" fill="#FFFFFF"/>
<rect x="240" y="30" width="420" height="380" rx="10" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<rect x="240" y="30" width="420" height="38" rx="10" fill="#F1EFE8" stroke="#F1EFE8" stroke-width="0"/>
<rect x="240" y="50" width="420" height="18" rx="6" fill="#F1EFE8" stroke="#F1EFE8" stroke-width="0"/>
<path d="M240 68 L660 68" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<text x="258" y="49" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">新增日程 / 修改日程</text>
<text x="636" y="49" font-size="14" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">×</text>
<text x="268" y="100" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">标题 *</text>
<rect x="340" y="84" width="300" height="32" rx="4" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1"/>
<text x="340" y="126" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start" dominant-baseline="central">标题不能为空（示例字段级提示）</text>
<text x="268" y="158" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">日期 *</text>
<rect x="340" y="142" width="220" height="32" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="352" y="158" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">2026-10-15</text>
<rect x="570" y="142" width="70" height="32" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="605" y="158" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">日历</text>
<text x="268" y="216" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">时间 *</text>
<rect x="340" y="200" width="220" height="32" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="352" y="216" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">14:30</text>
<text x="340" y="246" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">格式 HH:MM，24 小时制，分钟精度</text>
<text x="268" y="274" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">备注</text>
<rect x="340" y="258" width="300" height="72" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="352" y="278" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">讨论界面分工与任务卡</text>
<rect x="430" y="350" width="90" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="475" y="368" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">取消</text>
<rect x="550" y="350" width="90" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="595" y="368" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">保存</text>
<text x="450" y="418" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">新增与修改共用 schedule_form.py，仅窗口标题与预填数据不同；校验失败保留已填内容</text>
</svg>

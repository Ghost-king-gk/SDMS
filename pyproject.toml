[project]
name = "schedule-management-system"
version = "0.1.0"
description = "Python 图形化日程管理系统课程项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 首个业务包已加入 src/schedule_management/，因此项目改为可安装的 src 布局。
# 这样测试、类型检查和运行入口都能直接 import 本项目包，无需临时 PYTHONPATH。
package = true

[tool.hatch.build.targets.wheel]
# 发布名是 schedule-management-system，导入名是 schedule_management，
# 两者不同，因此必须显式声明打包路径，不能依赖自动推断。
packages = ["src/schedule_management"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# 本仓库的代码注释、文档字符串和面向用户的提示都使用中文，全角标点是有意书写。
# RUF001/RUF002/RUF003 默认把这些字符视为易混字符，因此显式放行常见中文标点；
# 规则本身保持启用，其他语言的易混字符（例如西里尔字母冒充拉丁字母）仍会被拦截。
allowed-confusables = ["，", "。", "、", "：", "；", "！", "？", "（", "）", "“", "”"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
